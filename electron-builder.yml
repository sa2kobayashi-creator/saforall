appId: com.sa2kobayashi.saforall
productName: saforall
copyright: Copyright © sa2kobayashi-creator
directories:
  output: release
  buildResources: build
# If pack fails with "app.asar ... being used by another process", close saforall.exe
# (and Explorer windows on release\win-unpacked), then retry — or temporarily set
# output: release-build and run npm run pack again.
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  - node_modules/node-pty/**/*
win:
  # Unsigned builds for local/dev distribution (SmartScreen may warn).
  # Set CSC_LINK + CSC_KEY_PASSWORD and flip to true for production signing.
  signAndEditExecutable: false
  forceCodeSigning: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: saforall
